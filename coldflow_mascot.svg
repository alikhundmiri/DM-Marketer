<svg width="400" height="520" viewBox="0 0 400 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    ColdFlow Mascot — "Drippy"
    The smol n cute AI droplet for ColdFlow.
    Tagline: "Smol n cute AI in your device for cold DM"
    Colors: Cyan #00CED1 → Blue #0891B2
    Use freely for marketing, app icon, and UI.
  -->
  <defs>
    <linearGradient id="bodyGrad" x1="200" y1="24" x2="200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00CED1"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="120" y1="60" x2="180" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.5"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00CED1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00CED1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="504" rx="104" ry="20" fill="url(#shadowGrad)" filter="url(#shadowBlur)"/>

  <!-- Main droplet body -->
  <path d="M200 24
           C200 24, 336 184, 336 316
           Q336 460 200 460
           Q64 460 64 316
           C64 184 200 24 200 24 Z"
        fill="url(#bodyGrad)"/>

  <!-- Shimmer highlight (upper-left) -->
  <path d="M144 84 C124 124 104 184 100 236 C110 216 130 176 140 136 Z"
        fill="url(#shimmerGrad)"/>

  <!-- Left eye -->
  <ellipse cx="152" cy="324" rx="34" ry="40" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="248" cy="324" rx="34" ry="40" fill="white"/>

  <!-- Left pupil -->
  <ellipse cx="158" cy="328" rx="18" ry="22" fill="#0891B2"/>
  <!-- Right pupil -->
  <ellipse cx="254" cy="328" rx="18" ry="22" fill="#0891B2"/>

  <!-- Left eye shine -->
  <circle cx="150" cy="316" r="8" fill="white"/>
  <!-- Right eye shine -->
  <circle cx="246" cy="316" r="8" fill="white"/>

  <!-- Smile -->
  <path d="M156 372 Q200 404 244 372"
        stroke="white" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Left blush -->
  <ellipse cx="108" cy="364" rx="28" ry="16" fill="white" opacity="0.28"/>
  <!-- Right blush -->
  <ellipse cx="292" cy="364" rx="28" ry="16" fill="white" opacity="0.28"/>

  <!-- Sparkle — top right -->
  <g transform="translate(304, 104)" opacity="0.85">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Mini sparkle — left -->
  <g transform="translate(88, 200)" opacity="0.6">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
